name: kese
description: "Kişisel bütçe takibi."
publish_to: 'none'
version: 0.5.1+7

environment:
  sdk: ^3.13.7

dependencies:
  cloud_firestore: ^7.1.0
  collection: ^1.19.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  home_widget: ^0.10.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  local_auth_android: ^2.3.0
  path_provider: ^2.1.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
